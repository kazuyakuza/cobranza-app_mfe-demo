<div class="demo-preview">
  <h1 class="cba-text-heading-md">Previsualización mfe-demo</h1>
  <p class="cba-text-small">Host simulado — eventos visibles en consola.</p>

  <fieldset class="demo-preview__controls">
    <legend class="cba-text-caption">Controles del host simulado</legend>

    <label class="demo-preview__field">
      <span class="cba-text-small">Tamaño</span>
      <select [(ngModel)]="size" name="size">
        <option value="100%">Completo (100 %)</option>
        <option value="50%">Mitad (50 %)</option>
      </select>
    </label>

    <label class="demo-preview__field">
      <span class="cba-text-small">Vista</span>
      <select [(ngModel)]="view" name="view">
        <option value="table">Tabla</option>
        <option value="create-form">Alta</option>
        <option value="profile">Perfil</option>
      </select>
    </label>

    <label class="demo-preview__field">
      <span class="cba-text-small">Título del header</span>
      <input
        type="text"
        [(ngModel)]="title"
        name="title"
        placeholder="Título para mfe:update-header" />
    </label>

    <label class="demo-preview__field">
      <span class="cba-text-small">Filas tabla</span>
      <input type="number" min="0" max="50" [(ngModel)]="tableRows" name="tableRows" />
    </label>

    <label class="demo-preview__field demo-preview__field--wide">
      <span class="cba-text-small">Profile JSON</span>
      <textarea [(ngModel)]="profileJson" name="profileJson" rows="3"></textarea>
    </label>

    <div class="demo-preview__toggles">
      <label class="demo-preview__checkbox">
        <input type="checkbox" [(ngModel)]="isCollapsed" name="isCollapsed" />
        <span>Colapsado</span>
      </label>
      <label class="demo-preview__checkbox">
        <input type="checkbox" [(ngModel)]="isFullscreen" name="isFullscreen" />
        <span>Pantalla completa</span>
      </label>
    </div>

    <div class="demo-preview__simulators">
      <cba-button size="sm" (cbaClick)="emitModuleState()">Enviar shell:module-state</cba-button>
      <cba-button size="sm" variant="secondary" (cbaClick)="emitVisibilityChanged(true)">Visible</cba-button>
      <cba-button size="sm" variant="secondary" (cbaClick)="emitVisibilityChanged(false)">Oculto</cba-button>
    </div>

    <label class="demo-preview__field">
      <span class="cba-text-small">Override min-height (debug, px)</span>
      <input
        type="number"
        min="0"
        max="1200"
        [ngModel]="debugMinHeightOverride()"
        (ngModelChange)="debugMinHeightOverride.set(numberOrNull($event))"
        name="debugMinHeightOverride" />
    </label>

    <label class="demo-preview__field">
      <span class="cba-text-small">Arrastre (dragState)</span>
      <select
        [ngModel]="simulatedDragState()"
        (ngModelChange)="simulatedDragState.set(stringOrUndefined($event))"
        name="simulatedDragState">
        <option [ngValue]="undefined">—</option>
        <option value="drag-start">drag-start</option>
        <option value="drag-end">drag-end</option>
        <option value="dropped">dropped</option>
      </select>
    </label>

    <label class="demo-preview__field">
      <span class="cba-text-small">Modo preview (previewMode)</span>
      <select
        [ngModel]="simulatedPreviewMode()"
        (ngModelChange)="simulatedPreviewMode.set(stringOrUndefined($event))"
        name="simulatedPreviewMode">
        <option [ngValue]="undefined">—</option>
        <option value="collapsed">collapsed</option>
      </select>
    </label>

    <div class="demo-preview__simulators">
      <cba-button size="sm" variant="secondary" (cbaClick)="redeclareMinHeight()">Reenviar min-height</cba-button>
    </div>

    <p class="demo-preview__min-height-readout cba-text-caption">
      Min-height declarado actual:
      {{ previewDeclaredMinHeightPx() === undefined ? '—' : previewDeclaredMinHeightPx() + ' px' }}
    </p>
  </fieldset>

  <cba-demo
    [moduleType]="'demo'"
    [instanceId]="instanceId()"
    [size]="size()"
    [isCollapsed]="isCollapsed()"
    [isFullscreen]="isFullscreen()"
    [data]="data()" />
</div>
